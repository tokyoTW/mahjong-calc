<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>符計算＆点数計算</title>
  <style>
    :root {
      --primary: #9b6bc7;
      --primary-dark: #6b3fa0;
      --primary-pink: #e58ab8;
      --primary-light: #f8f0fc;
      --pink-light: #fdf2f8;
      --primary-border: #d8b4fe;
      --accent: #be185d;
      --bg: #fdf7fb;
      --card-bg: #ffffff;
      --text: #3b2847;
      --text-muted: #7c688a;
      --border: #eedcf6;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #fdf2f8 0%, #f5f0ff 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 140px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 12px 0 4px;
    }
    header h1 {
      font-size: 1.55rem;
      color: var(--primary-dark);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    /* カード */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 4px 14px rgba(155, 107, 199, 0.08);
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .step-badge {
      background: linear-gradient(135deg, #ec8bbd 0%, #a97ce0 100%);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      margin-right: 8px;
    }

    /* 質問ブロック */
    .question-block {
      margin-bottom: 18px;
    }
    .question-block:last-child {
      margin-bottom: 0;
    }
    .q-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      display: block;
    }
    .q-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: -6px;
      margin-bottom: 10px;
      display: block;
    }

    /* ボタングループ */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }
    .btn-group-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .btn-toggle {
      background: #faf5ff;
      border: 1.5px solid #e5d4f5;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #5b456e;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-toggle.active {
      background: linear-gradient(135deg, #f3d6ec 0%, #e5d4fb 100%);
      color: #581c87;
      border-color: #a855f7;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.2);
      font-weight: 700;
    }
    .btn-toggle:disabled {
      opacity: 0.38;
      background: #f3eff6;
      border-color: #e4dceb;
      color: #a495b0;
      cursor: not-allowed;
      text-decoration: line-through;
      box-shadow: none;
    }

    /* イラスト入りボタン調整 */
    .btn-visual {
      padding: 12px 8px;
      min-height: 92px;
    }
    .tile-illust {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
    }
    .btn-subtext {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .btn-toggle.active .btn-subtext {
      color: #6b21a8;
    }

    /* 役グリッド */
    .yaku-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }
    .yaku-btn {
      background: #fffafd;
      border: 1.5px solid #eadbf5;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #4c375c;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
      user-select: none;
    }
    .yaku-btn .han-tag {
      font-size: 0.72rem;
      background: #f3e8ff;
      padding: 2px 6px;
      border-radius: 6px;
      color: #7e22ce;
    }
    .yaku-btn.active {
      background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%);
      border-color: #c084fc;
      color: #581c87;
      font-weight: 700;
    }
    .yaku-btn.active .han-tag {
      background: #a855f7;
      color: #ffffff;
    }
    .yaku-btn:disabled {
      opacity: 0.35;
      background: #f5f2f7;
      border-color: #e8e1ee;
      color: #a395b0;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* ステッパー（ドラ・本場用） */
    .stepper-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      background: #faf5ff;
      border-radius: 10px;
      border: 1.5px solid #e2cff4;
      overflow: hidden;
      flex-shrink: 0;
    }
    .stepper button {
      background: transparent;
      border: none;
      padding: 10px 18px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary-dark);
      cursor: pointer;
    }
    .stepper button:hover:not(:disabled) {
      background: #f3e8ff;
    }
    .stepper button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .stepper span {
      min-width: 40px;
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--text);
    }
    .stepper-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* スキップ案内通知 */
    .skip-notice {
      background: linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 100%);
      border: 1.5px solid #e9d5ff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6b21a8;
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 12px;
    }

    /* STEP2 ④形（横スクロール不要のレスポンシブカード） */
    .shape-group {
      margin-bottom: 14px;
    }
    .shape-group:last-child {
      margin-bottom: 0;
    }
    .shape-group-header {
      background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
      border: 1px solid #e9d5ff;
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #581c87;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .shape-group-sub {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .shape-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 640px) {
      .shape-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .shape-card {
      background: #ffffff;
      border: 1.5px solid #eadbf5;
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .shape-card.has-count {
      background: #fdf2f8;
      border-color: #c084fc;
      box-shadow: 0 2px 6px rgba(168, 85, 247, 0.14);
    }
    .shape-card.disabled-card {
      opacity: 0.35;
      background: #f5f2f7;
    }
    .shape-card-top {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .shape-type-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: #581c87;
    }
    .shape-fu-badge {
      font-size: 0.86rem;
      font-weight: 800;
      color: #be185d;
    }
    .shape-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .cell-svg {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
      min-height: 28px;
    }

    /* スマホでタップしやすい大きめステッパー */
    .shape-stepper {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
      background: #faf5ff;
      border-radius: 10px;
      border: 1.5px solid #d8b4fe;
      overflow: hidden;
      margin-top: 4px;
    }
    .shape-stepper button {
      background: #f3e8ff;
      border: none;
      min-height: 44px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background 0.12s ease;
    }
    .shape-stepper button:active:not(:disabled) {
      background: #e9d5ff;
    }
    .shape-stepper button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }
    .shape-stepper span {
      min-width: 32px;
      padding: 0 4px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }

    /* 固定結果バー（画面下部・淡いピンク〜薄紫） */
    .result-bar {
      position: sticky;
      bottom: 12px;
      background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%);
      color: #4c1d95;
      border: 2px solid #d8b4fe;
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }
    .result-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .result-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .result-meta {
      font-size: 0.88rem;
      color: #7e22ce;
      font-weight: 800;
    }
    .result-yomi {
      font-size: 0.78rem;
      color: #9d174d;
      font-weight: 600;
    }
    .result-right {
      flex-shrink: 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    /* 右上に黒字・少し小さめで符を表示 */
    .result-fu-live {
      font-size: 0.72rem;
      color: #111827;
      font-weight: 700;
      line-height: 1.2;
    }
    .result-score {
      font-size: 1.55rem;
      font-weight: 800;
      color: #6b21a8;
      letter-spacing: 0.5px;
      line-height: 1.15;
    }
    .result-breakdown {
      font-size: 0.72rem;
      color: #7c688a;
      font-weight: 600;
    }
    /* 選択内容の小テキスト表示エリア */
    .result-selected {
      font-size: 0.73rem;
      color: #374151;
      font-weight: 600;
      line-height: 1.4;
      padding-top: 6px;
      border-top: 1px dashed rgba(168, 85, 247, 0.35);
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>符計算＆点数計算</h1>
  </header>

  <!-- 第1フェーズ：翻の確定 -->
  <section class="card">
    <div class="card-title">
      <span><span class="step-badge">STEP 1</span>基本条件と役（翻数）</span>
      <span id="hanSummary" style="font-size:0.95rem; color:#9333ea;">0翻</span>
    </div>

    <!-- ① あなたの立場 -->
    <div class="question-block">
      <span class="q-label">① あなたの立場</span>
      <div class="btn-group">
        <button class="btn-toggle active" id="btnChild" onclick="setRole('child')">子</button>
        <button class="btn-toggle" id="btnDealer" onclick="setRole('dealer')">親</button>
      </div>
    </div>

    <!-- ② リーチしましたか？ -->
    <div class="question-block" id="riichiBlock">
      <span class="q-label">② リーチしましたか？</span>
      <div class="btn-group">
        <button class="btn-toggle active" id="riichiNone" onclick="setRiichi('none')">なし</button>
        <button class="btn-toggle" id="riichiNormal" onclick="setRiichi('riichi')">リーチ (1翻)</button>
        <button class="btn-toggle" id="riichiDouble" onclick="setRiichi('double')">Wリーチ (2翻)</button>
      </div>
    </div>

    <!-- ③ 一発であがりましたか？ -->
    <div class="question-block" id="ippatsuBlock">
      <span class="q-label">③ 一発であがりましたか？</span>
      <div class="btn-group">
        <button class="btn-toggle active" id="ippatsuNo" onclick="setIppatsu(false)">いいえ</button>
        <button class="btn-toggle" id="ippatsuYes" onclick="setIppatsu(true)">はい (1翻)</button>
      </div>
    </div>

    <!-- ④ アガリ方 -->
    <div class="question-block">
      <span class="q-label">④ アガリ方</span>
      <div class="btn-group" style="margin-bottom:8px;">
        <button class="btn-toggle active" id="btnRon" onclick="setWinType('ron')">ロン</button>
        <button class="btn-toggle" id="btnTsumo" onclick="setWinType('tsumo')">ツモ</button>
      </div>
      <div class="btn-group">
        <button class="btn-toggle active" id="btnMenzen" onclick="setMenzen(true)">門前（鳴いてない）</button>
        <button class="btn-toggle" id="btnNaki" onclick="setMenzen(false)">副露（ポン・チーあり）</button>
      </div>
    </div>

    <!-- ⑤ 役 -->
    <div class="question-block">
      <span class="q-label">⑤ 役</span>
      <div class="yaku-grid" id="yakuContainer"></div>
    </div>

    <!-- ⑥ ドラ -->
    <div class="question-block">
      <span class="q-label">⑥ ドラ（ドラ・裏ドラの合計枚数）</span>
      <div class="stepper-row">
        <div class="stepper">
          <button onclick="changeDora(-1)">−</button>
          <span id="doraCount">0</span>
          <button onclick="changeDora(1)">＋</button>
        </div>
      </div>
    </div>

    <!-- ⑦ 本場（積み棒） -->
    <div class="question-block">
      <span class="q-label">⑦ 本場（積み棒）</span>
      <div class="stepper-row">
        <div class="stepper">
          <button onclick="changeHonba(-1)">−</button>
          <span id="honbaCount">0</span>
          <button onclick="changeHonba(1)">＋</button>
        </div>
        <span class="stepper-hint" id="honbaHint">0本場（＋0点）</span>
      </div>
    </div>

    <!-- スキップ案内 -->
    <div id="skipMessage" class="skip-notice" style="display:none;"></div>
  </section>

  <!-- 第2フェーズ：符の確定（必要な場合のみ表示） -->
  <section class="card" id="fuSection">
    <div class="card-title">
      <span><span class="step-badge">STEP 2</span>符の計算</span>
    </div>

    <!-- ① アガリ方 -->
    <div class="question-block">
      <span class="q-label">① アガリ方</span>
      <span class="q-note">※副露ロンはどちらも選択不要（0符）</span>
      <div class="btn-group-2col">
        <button class="btn-toggle" id="fuAgariTsumo" onclick="toggleFuAgari('tsumo')">
          <span>ツモ</span>
          <span class="btn-subtext">＋2符</span>
        </button>
        <button class="btn-toggle active" id="fuAgariMenzenRon" onclick="toggleFuAgari('menzen_ron')">
          <span>面前ロン（門前加符）</span>
          <span class="btn-subtext">＋10符</span>
        </button>
      </div>
    </div>

    <!-- ② 待ち方（4種類） -->
    <div class="question-block">
      <span class="q-label">② 待ち方</span>
      <div class="btn-group-2col">
        <button class="btn-toggle btn-visual active" id="waitRyanmen" onclick="setWait('ryanmen')">
          <div class="tile-illust">
            <svg width="124" height="36" viewBox="0 0 124 36" aria-hidden="true">
              <rect x="2" y="4" width="20" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="12" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#db2777">1</text>
              <text x="30" y="22" text-anchor="middle" font-size="10" fill="#a855f7">←</text>
              <rect x="38" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="49" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">2</text>
              <rect x="64" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="75" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">3</text>
              <text x="94" y="22" text-anchor="middle" font-size="10" fill="#a855f7">→</text>
              <rect x="102" y="4" width="20" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="112" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#db2777">4</text>
            </svg>
          </div>
          <span>リャンメン／シャンポン</span>
          <span class="btn-subtext">0符</span>
        </button>

        <button class="btn-toggle btn-visual" id="waitKanchan" onclick="setWait('kanchan')">
          <div class="tile-illust">
            <svg width="86" height="36" viewBox="0 0 86 36" aria-hidden="true">
              <rect x="4" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="15" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">2</text>
              <rect x="32" y="4" width="22" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="43" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">3</text>
              <rect x="60" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="71" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">4</text>
            </svg>
          </div>
          <span>カンチャン待ち</span>
          <span class="btn-subtext">＋2符</span>
        </button>

        <button class="btn-toggle btn-visual" id="waitPenchan" onclick="setWait('penchan')">
          <div class="tile-illust">
            <svg width="86" height="36" viewBox="0 0 86 36" aria-hidden="true">
              <rect x="4" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="15" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">1</text>
              <rect x="32" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="43" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">2</text>
              <rect x="60" y="4" width="22" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="71" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">3</text>
            </svg>
          </div>
          <span>ペンチャン待ち</span>
          <span class="btn-subtext">＋2符</span>
        </button>

        <button class="btn-toggle btn-visual" id="waitTanki" onclick="setWait('tanki')">
          <div class="tile-illust">
            <svg width="62" height="36" viewBox="0 0 62 36" aria-hidden="true">
              <rect x="5" y="4" width="22" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="16" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">五</text>
              <rect x="35" y="4" width="22" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="46" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">五</text>
            </svg>
          </div>
          <span>タンキ待ち</span>
          <span class="btn-subtext">＋2符</span>
        </button>
      </div>
    </div>

    <!-- ③ アタマ -->
    <div class="question-block">
      <span class="q-label">③ アタマ</span>

// --- 初期化 ---
function init() {
  renderYakuGrid();
  renderShapeCards();
  syncFuAgariFromStep1();
  recalc();
}

// 役グリッドの描画
function renderYakuGrid() {
  const container = document.getElementById('yakuContainer');
  container.innerHTML = '';

  YAKU_LIST.forEach(yaku => {
    const btn = document.createElement('button');
    btn.className = 'yaku-btn';
    btn.id = 'yaku_' + yaku.id;

    const actualHan = (!state.menzen && yaku.hanNaki !== undefined) ? yaku.hanNaki : yaku.han;
    btn.innerHTML = `<span>${yaku.name}</span><span class="han-tag">${actualHan}翻</span>`;

    btn.onclick = () => toggleYaku(yaku.id);
    container.appendChild(btn);
  });
}

// 形につく符カードの描画
function renderShapeCards() {
  const container = document.getElementById('shapeCardsContainer');
  container.innerHTML = '';

  SHAPE_GROUPS.forEach(group => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'shape-group';

    const header = document.createElement('div');
    header.className = 'shape-group-header';
    header.innerHTML = `<span>${group.groupTitle}</span><span class="shape-group-sub">${group.groupSub}</span>`;
    groupDiv.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'shape-grid';

    group.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'shape-card';
      card.id = 'card_' + item.key;
      card.innerHTML = `
        <div class="shape-card-top">
          <span class="shape-type-name">${item.label}</span>
          <span class="shape-fu-badge">${item.fu}符</span>
        </div>
        <div class="shape-desc">${item.desc}</div>
        <div class="cell-svg">${item.svg}</div>
        <div class="shape-stepper">
          <button id="dec_${item.key}" onclick="changeShape('${item.key}', -1)">−</button>
          <span id="val_${item.key}">0</span>
          <button id="inc_${item.key}" onclick="changeShape('${item.key}', 1)">＋</button>
        </div>
      `;
      grid.appendChild(card);
    });

    groupDiv.appendChild(grid);
    container.appendChild(groupDiv);
  });
}

// STEP1のアガリ方・門前状態からSTEP2の①アガリ方を同期
function syncFuAgariFromStep1() {
  if (state.winType === 'tsumo') {
    state.fuAgari = 'tsumo';
  } else if (state.menzen && state.winType === 'ron') {
    state.fuAgari = 'menzen_ron';
  } else {
    state.fuAgari = 'none';
  }
}

// --- 操作ハンドラ ---
function setRole(role) {
  state.role = role;
  document.getElementById('btnChild').classList.toggle('active', role === 'child');
  document.getElementById('btnDealer').classList.toggle('active', role === 'dealer');
  recalc();
}

function setRiichi(riichi) {
  if (!state.menzen && riichi !== 'none') return;
  state.riichi = riichi;
  if (riichi === 'none') {
    state.ippatsu = false;
  }
  recalc();
}

function setIppatsu(flag) {
  if (state.riichi === 'none' && flag) return;
  state.ippatsu = flag;
  recalc();
}

function setWinType(winType) {
  state.winType = winType;
  document.getElementById('btnRon').classList.toggle('active', winType === 'ron');
  document.getElementById('btnTsumo').classList.toggle('active', winType === 'tsumo');
  syncFuAgariFromStep1();
  recalc();
}

function setMenzen(menzen) {
  state.menzen = menzen;
  document.getElementById('btnMenzen').classList.toggle('active', menzen);
  document.getElementById('btnNaki').classList.toggle('active', !menzen);

  if (!menzen) {
    state.riichi = 'none';
    state.ippatsu = false;
  }

  // 門前役の自動解除
  state.selectedYaku = state.selectedYaku.filter(id => {
    const yaku = YAKU_LIST.find(y => y.id === id);
    return !(yaku && yaku.menzenOnly && !menzen);
  });

  syncFuAgariFromStep1();
  renderYakuGrid();
  recalc();
}

function toggleYaku(yakuId) {
  const index = state.selectedYaku.indexOf(yakuId);
  if (index >= 0) {
    state.selectedYaku.splice(index, 1);
  } else {
    const target = YAKU_LIST.find(y => y.id === yakuId);
    if (target && target.excludes) {
      state.selectedYaku = state.selectedYaku.filter(id => !target.excludes.includes(id));
    }
    state.selectedYaku = state.selectedYaku.filter(id => {
      const y = YAKU_LIST.find(item => item.id === id);
      return !(y && y.excludes && y.excludes.includes(yakuId));
    });

    state.selectedYaku.push(yakuId);
  }
  recalc();
}

function changeDora(delta) {
  state.dora = Math.max(0, Math.min(13, state.dora + delta));
  document.getElementById('doraCount').innerText = state.dora;
  recalc();
}

function changeHonba(delta) {
  state.honba = Math.max(0, Math.min(20, state.honba + delta));
  document.getElementById('honbaCount').innerText = state.honba;
  recalc();
}

function toggleFuAgari(type) {
  if (type === 'menzen_ron' && !state.menzen) return;
  if (state.fuAgari === type) {
    state.fuAgari = 'none';
  } else {
    state.fuAgari = type;
  }
  recalc();
}

function setWait(wait) {
  state.waitType = wait;
  ['waitRyanmen', 'waitKanchan', 'waitPenchan', 'waitTanki'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  if (wait === 'ryanmen') document.getElementById('waitRyanmen').classList.add('active');
  if (wait === 'kanchan') document.getElementById('waitKanchan').classList.add('active');
  if (wait === 'penchan') document.getElementById('waitPenchan').classList.add('active');
  if (wait === 'tanki') document.getElementById('waitTanki').classList.add('active');
  recalc();
}

function toggleHead(head) {
  if (state.headType === head) {
    state.headType = 'none';
  } else {
    state.headType = head;
  }
  recalc();
}

function changeShape(key, delta) {
  state.shapes[key] = Math.max(0, Math.min(4, state.shapes[key] + delta));
  document.getElementById('val_' + key).innerText = state.shapes[key];
  recalc();
}

// --- 選択内容のテキスト組み立て ---
function buildSelectedSummary() {
  const parts = [];

  if (state.riichi === 'riichi') parts.push('リーチ');
  if (state.riichi === 'double') parts.push('Wリーチ');
  if (state.ippatsu) parts.push('一発');

  if (state.menzen && state.winType === 'ron') parts.push('メンゼンロン');
  if (state.menzen && state.winType === 'tsumo') parts.push('メンゼンツモ');
  if (!state.menzen && state.winType === 'ron') parts.push('副露ロン');
  if (!state.menzen && state.winType === 'tsumo') parts.push('副露ツモ');

  state.selectedYaku.forEach(id => {
    const y = YAKU_LIST.find(item => item.id === id);
    if (y) parts.push(y.shortName || y.name);
  });

  if (state.dora > 0) parts.push(`ドラ${state.dora}`);
  if (state.honba > 0) parts.push(`${state.honba}本場`);

  return parts.join('・');
}

// --- 排他ルールの判定とUI更新 ---
function updateConstraints() {
  // ②リーチボタンの状態更新（副露時はリーチ不可）
  const rNone = document.getElementById('riichiNone');
  const rNormal = document.getElementById('riichiNormal');
  const rDouble = document.getElementById('riichiDouble');
  rNone.classList.toggle('active', state.riichi === 'none');
  rNormal.classList.toggle('active', state.riichi === 'riichi');
  rDouble.classList.toggle('active', state.riichi === 'double');
  rNormal.disabled = !state.menzen;
  rDouble.disabled = !state.menzen;

  // ③一発ボタンの状態更新（リーチなし時は「はい」不可）
  const ipNo = document.getElementById('ippatsuNo');
  const ipYes = document.getElementById('ippatsuYes');
  if (state.riichi === 'none') {
    state.ippatsu = false;
  }
  ipNo.classList.toggle('active', !state.ippatsu);
  ipYes.classList.toggle('active', state.ippatsu);
  ipYes.disabled = (state.riichi === 'none');

  // ⑤役ボタンの状態更新
  YAKU_LIST.forEach(yaku => {
    const btn = document.getElementById('yaku_' + yaku.id);
    if (!btn) return;

    const isSelected = state.selectedYaku.includes(yaku.id);
    btn.classList.toggle('active', isSelected);

    let disabled = false;

    if (yaku.menzenOnly && !state.menzen) disabled = true;

    state.selectedYaku.forEach(selectedId => {
      if (selectedId === yaku.id) return;
      const sYaku = YAKU_LIST.find(y => y.id === selectedId);
      if (sYaku && sYaku.excludes && sYaku.excludes.includes(yaku.id)) disabled = true;
      if (yaku.excludes && yaku.excludes.includes(selectedId)) disabled = true;
    });

    btn.disabled = disabled;
  });

  // ⑦本場の補足表示
  const honbaBonus = state.honba * 300;
  const honbaEach = state.honba * 100;
  document.getElementById('honbaHint').innerText = state.honba === 0
    ? '0本場（＋0点）'
    : (state.winType === 'ron'
      ? `${state.honba}本場（ロン ＋${honbaBonus.toLocaleString()}点）`
      : `${state.honba}本場（ツモ 各＋${honbaEach.toLocaleString()}点）`);

  // STEP2 ①アガリ方の状態・副露時の面前ロン無効化
  const btnFuTsumo = document.getElementById('fuAgariTsumo');
  const btnFuMenzenRon = document.getElementById('fuAgariMenzenRon');
  if (!state.menzen) {
    if (state.fuAgari === 'menzen_ron') state.fuAgari = 'none';
    btnFuMenzenRon.disabled = true;
  } else {
    btnFuMenzenRon.disabled = false;
  }
  btnFuTsumo.classList.toggle('active', state.fuAgari === 'tsumo');
  btnFuMenzenRon.classList.toggle('active', state.fuAgari === 'menzen_ron');

  // STEP2 ③アタマの状態・タンヤオ時の役牌・連風牌無効化
  const hasTanyao = state.selectedYaku.includes('tanyao');
  const headYakuhaiBtn = document.getElementById('headYakuhai');
  const headRenpuBtn = document.getElementById('headRenpu');

  if (hasTanyao) {
    state.headType = 'none';
    headYakuhaiBtn.disabled = true;
    headRenpuBtn.disabled = true;
  } else {
    headYakuhaiBtn.disabled = false;
    headRenpuBtn.disabled = false;
  }
  headYakuhaiBtn.classList.toggle('active', state.headType === 'yakuhai');
  headRenpuBtn.classList.toggle('active', state.headType === 'renpu');

  // STEP2 ④形カードのグレーアウト連動
  SHAPE_GROUPS.forEach(group => {
    group.items.forEach(item => {
      const card = document.getElementById('card_' + item.key);
      const decBtn = document.getElementById('dec_' + item.key);
      const incBtn = document.getElementById('inc_' + item.key);
      const valSpan = document.getElementById('val_' + item.key);

      let disabled = false;
      if (hasTanyao && group.isYaochu) disabled = true;
      if (state.menzen && item.kind === 'minkan') disabled = true;
      if (state.menzen && state.winType === 'tsumo' && item.kind === 'minko') disabled = true;

      if (disabled) {
        state.shapes[item.key] = 0;
        valSpan.innerText = '0';
        card.classList.add('disabled-card');
        card.classList.remove('has-count');
        decBtn.disabled = true;
        incBtn.disabled = true;
      } else {
        card.classList.remove('disabled-card');
        card.classList.toggle('has-count', state.shapes[item.key] > 0);
        decBtn.disabled = false;
        incBtn.disabled = false;
      }
    });
  });
}

// --- 符・翻・点数の総合計算 ---
function recalc() {
  updateConstraints();

  // 1. 翻数の集計
  let han = 0;
  if (state.riichi === 'riichi') han += 1;
  if (state.riichi === 'double') han += 2;
  if (state.ippatsu) han += 1;

  state.selectedYaku.forEach(id => {
    const y = YAKU_LIST.find(item => item.id === id);
    if (y) {
      const h = (!state.menzen && y.hanNaki !== undefined) ? y.hanNaki : y.han;
      han += h;
    }
  });

  han += state.dora;
  document.getElementById('hanSummary').innerText = han + '翻';

  // 2. 符計算スキップ条件の判定
  const fuSection = document.getElementById('fuSection');
  const skipMessage = document.getElementById('skipMessage');
  let finalFu = 30;
  let fuLiveText = '';
  let skipReason = '';

  const hasPinfu = state.selectedYaku.includes('pinfu');
  const hasChiitoi = state.selectedYaku.includes('chiitoitsu');

  if (han >= 5) {
    skipReason = `🎉 <strong>${han}翻で満貫以上確定！</strong> 符に関係なく点数が決まるため、符計算は不要です。`;
    fuLiveText = '符計算不要（満貫以上）';
  } else if (hasChiitoi) {
    finalFu = 25;
    skipReason = '七対子（チートイツ）は <strong>25符固定</strong> です。符計算は不要です。';
    fuLiveText = '符：25符固定';
  } else if (hasPinfu && state.winType === 'tsumo') {
    finalFu = 20;
    skipReason = '門前平和ツモは特例により <strong>20符固定</strong> です。符計算は不要です。';
    fuLiveText = '符：20符固定';
  } else if (hasPinfu && state.winType === 'ron') {
    finalFu = 30;
    skipReason = '門前平和ロンは <strong>30符固定</strong> です。符計算は不要です。';
    fuLiveText = '符：30符固定';
  }

  if (skipReason) {
    fuSection.style.display = 'none';
    skipMessage.innerHTML = skipReason;
    skipMessage.style.display = 'flex';
  } else {
    fuSection.style.display = 'block';
    skipMessage.style.display = 'none';

    const baseFu = 20;
    const agariFu = state.fuAgari === 'tsumo' ? 2 : (state.fuAgari === 'menzen_ron' ? 10 : 0);
    const waitFu = state.waitType === 'ryanmen' ? 0 : 2;
    const headFu = state.headType === 'yakuhai' ? 2 : (state.headType === 'renpu' ? 4 : 0);

    const shapeFu =
      state.shapes.t_minko * 2 +
      state.shapes.t_anko * 4 +
      state.shapes.t_minkan * 8 +
      state.shapes.t_ankan * 16 +
      state.shapes.y_minko * 4 +
      state.shapes.y_anko * 8 +
      state.shapes.y_minkan * 16 +
      state.shapes.y_ankan * 32;

    const rawFu = baseFu + agariFu + waitFu + headFu + shapeFu;

    // 切り上げ（鳴きロンで20符の形は30符特例）
    if (!state.menzen && state.winType === 'ron' && rawFu === 20) {
      finalFu = 30;
    } else {
      finalFu = Math.ceil(rawFu / 10) * 10;
    }
    if (finalFu < 30 && !hasChiitoi) finalFu = 30;

    fuLiveText = `符：計 ${rawFu}符 ➔ ${finalFu}符`;
  }

  // 3. 点数算出と表示更新
  updateResult(han, finalFu, fuLiveText);
}

function updateResult(han, fu, fuLiveText) {
  const isDealer = state.role === 'dealer';
  const roleName = isDealer ? '親' : '子';
  const metaEl = document.getElementById('resMeta');
  const fuLiveEl = document.getElementById('resFuLive');
  const yomiEl = document.getElementById('resYomi');
  const scoreEl = document.getElementById('resScore');
  const breakEl = document.getElementById('resBreakdown');
  const selectedEl = document.getElementById('resSelected');

  // 符と選択内容のリアルタイム表示は常に更新
  fuLiveEl.innerText = fuLiveText;
  selectedEl.innerText = buildSelectedSummary();

  const honbaTag = state.honba > 0 ? ` ／ ${state.honba}本場` : '';
  const honbaRonAdd = state.honba * 300;
  const honbaTsumoAdd = state.honba * 100;

  // 役なしチェック
  if (han === 0) {
    metaEl.innerText = `${roleName} ／ 役なし${honbaTag}`;
    yomiEl.innerText = 'アガれません';
    scoreEl.innerText = '0 点';
    breakEl.innerText = '役を1つ以上選択してください';
    return;
  }

  // 満貫以上の判定
  if (han >= 5) {
    let title = '', ronBase = 0, tsumoChild = 0, tsumoDealer = 0, tsumoAll = 0;
    let yomiRon = '', yomiTsumo = '';

    if (han === 5) {
      title = '満貫';
      ronBase = isDealer ? 12000 : 8000;
      tsumoChild = 2000; tsumoDealer = 4000; tsumoAll = 4000;
      yomiRon = isDealer ? 'イチニッパ' : 'マンガン';
      yomiTsumo = isDealer ? 'ヨンセンオール' : 'ニセン・ヨンセン';
    } else if (han <= 7) {
      title = '跳満';
      ronBase = isDealer ? 18000 : 12000;
      tsumoChild = 3000; tsumoDealer = 6000; tsumoAll = 6000;
      yomiRon = isDealer ? 'イチハチ' : 'イチニッパ';
      yomiTsumo = isDealer ? 'ロクセンオール' : 'サンゼン・ロクセン';
    } else if (han <= 10) {
      title = '倍満';
      ronBase = isDealer ? 24000 : 16000;
      tsumoChild = 4000; tsumoDealer = 8000; tsumoAll = 8000;
      yomiRon = isDealer ? 'ニーヨン' : 'イチロク';
      yomiTsumo = isDealer ? 'ハッセンオール' : 'ヨンセン・ハッセン';
    } else if (han <= 12) {
      title = '三倍満';
      ronBase = isDealer ? 36000 : 24000;
      tsumoChild = 6000; tsumoDealer = 12000; tsumoAll = 12000;
      yomiRon = isDealer ? 'サンロク' : 'ニーヨン';
      yomiTsumo = isDealer ? 'イチニオール' : 'ロクセン・イチニ';
    } else {
      title = '数え役満';
      ronBase = isDealer ? 48000 : 32000;
      tsumoChild = 8000; tsumoDealer = 16000; tsumoAll = 16000;
      yomiRon = isDealer ? 'ヨンパチ' : 'ザンニ';
      yomiTsumo = isDealer ? 'イチロクオール' : 'ハッセン・イチロク';
    }

    metaEl.innerText = `${roleName} ／ ${han}翻 【${title}】${honbaTag}`;

    if (state.winType === 'ron') {
      const total = ronBase + honbaRonAdd;
      scoreEl.innerText = `${total.toLocaleString()} 点`;
      yomiEl.innerText = state.honba > 0 ? `${yomiRon}は${total.toLocaleString()}点` : yomiRon;
      breakEl.innerText = state.honba > 0
        ? `基本${ronBase.toLocaleString()} ＋ 本場${honbaRonAdd.toLocaleString()}`
        : '放銃者の全額払い';
    } else if (isDealer) {
      const each = tsumoAll + honbaTsumoAdd;
      scoreEl.innerText = `${each.toLocaleString()}オール`;
      yomiEl.innerText = state.honba > 0 ? `${yomiTsumo}は${each.toLocaleString()}オール` : yomiTsumo;
      breakEl.innerText = state.honba > 0
        ? `基本${tsumoAll.toLocaleString()} ＋ 本場${honbaTsumoAdd.toLocaleString()}ずつ`
        : '各家から均等払い';
    } else {
      const cPay = tsumoChild + honbaTsumoAdd;
      const dPay = tsumoDealer + honbaTsumoAdd;
      scoreEl.innerText = `${cPay.toLocaleString()}・${dPay.toLocaleString()}`;
      yomiEl.innerText = state.honba > 0 ? `${yomiTsumo}は${cPay}・${dPay}` : yomiTsumo;
      breakEl.innerText = state.honba > 0
        ? `子${cPay.toLocaleString()} ／ 親${dPay.toLocaleString()}（本場込）`
        : '子払い ／ 親払い';
    }
    return;
  }

  // 1〜4翻の通常計算
  const safeFu = fu > 70 ? 70 : fu;
  const table = isDealer ? SCORE_DATA.dealer : SCORE_DATA.child;
  const entry = (table[safeFu] && table[safeFu][han]) ? table[safeFu][han] : null;

  metaEl.innerText = `${roleName} ／ ${han}翻 ${safeFu}符${honbaTag}`;

  if (!entry) {
    const fallbackRon = (isDealer ? 12000 : 8000) + honbaRonAdd;
    scoreEl.innerText = `${fallbackRon.toLocaleString()} 点`;
    yomiEl.innerText = 'マンガン';
    breakEl.innerText = '';
    return;
  }

  if (state.winType === 'tsumo') {
    if (isDealer && entry.tsumoAll) {
      const each = entry.tsumoAll + honbaTsumoAdd;
      const baseYomi = entry.yomiTsumo || entry.yomi || '';
      scoreEl.innerText = `${each.toLocaleString()}オール`;
      yomiEl.innerText = state.honba > 0 ? `${baseYomi}は${each.toLocaleString()}オール` : baseYomi;
      breakEl.innerText = state.honba > 0
        ? `基本${entry.tsumoAll.toLocaleString()} ＋ 本場${honbaTsumoAdd.toLocaleString()}ずつ`
        : '各家から均等払い';
    } else if (!isDealer && entry.tsumo) {
      const cPay = entry.tsumo[0] + honbaTsumoAdd;
      const dPay = entry.tsumo[1] + honbaTsumoAdd;
      const baseYomi = entry.yomiTsumo || entry.yomi || '';
      scoreEl.innerText = `${cPay.toLocaleString()}・${dPay.toLocaleString()}`;
      yomiEl.innerText = state.honba > 0 ? `${baseYomi}は${cPay}・${dPay}` : baseYomi;
      breakEl.innerText = state.honba > 0
        ? `子${cPay.toLocaleString()} ／ 親${dPay.toLocaleString()}（本場込）`
        : '子払い ／ 親払い';
    } else if (entry.ron) {
      const total = entry.ron + honbaRonAdd;
      scoreEl.innerText = `${total.toLocaleString()} 点`;
      yomiEl.innerText = entry.yomiRon || entry.yomi || '';
      breakEl.innerText = '';
    } else {
      scoreEl.innerText = '-';
      yomiEl.innerText = '';
      breakEl.innerText = '';
    }
  } else {
    if (entry.ron) {
      const total = entry.ron + honbaRonAdd;
      const baseYomi = entry.yomiRon || entry.yomi || '';
      scoreEl.innerText = `${total.toLocaleString()} 点`;
      yomiEl.innerText = state.honba > 0 ? `${baseYomi}は${total.toLocaleString()}点` : baseYomi;
      breakEl.innerText = state.honba > 0
        ? `基本${entry.ron.toLocaleString()} ＋ 本場${honbaRonAdd.toLocaleString()}`
        : '放銃者の全額払い';
    } else if (isDealer && entry.tsumoAll) {
      const each = entry.tsumoAll + honbaTsumoAdd;
      scoreEl.innerText = `${each.toLocaleString()}オール`;
      yomiEl.innerText = entry.yomi || '';
      breakEl.innerText = '';
    } else if (!isDealer && entry.tsumo) {
      const cPay = entry.tsumo[0] + honbaTsumoAdd;
      const dPay = entry.tsumo[1] + honbaTsumoAdd;
      scoreEl.innerText = `${cPay.toLocaleString()}・${dPay.toLocaleString()}`;
      yomiEl.innerText = entry.yomi || '';
      breakEl.innerText = '';
    } else {
      scoreEl.innerText = '-';
      yomiEl.innerText = '';
      breakEl.innerText = '';
    }
  }
}

// 起動
init();
</script>

</body>
</html>

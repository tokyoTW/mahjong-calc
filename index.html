<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>符計算＆点数計算</title>
  <style>
    :root {
      --primary: #9b6bc7;
      --primary-dark: #6b3fa0;
      --primary-pink: #e58ab8;
      --primary-light: #f8f0fc;
      --pink-light: #fdf2f8;
      --primary-border: #d8b4fe;
      --accent: #be185d;
      --bg: #fdf7fb;
      --card-bg: #ffffff;
      --text: #3b2847;
      --text-muted: #7c688a;
      --border: #eedcf6;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #fdf2f8 0%, #f5f0ff 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 96px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 12px 0 4px;
    }
    header h1 {
      font-size: 1.5rem;
      color: var(--primary-dark);
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* カード */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 4px 14px rgba(155, 107, 199, 0.08);
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-badge {
      background: linear-gradient(135deg, #ec8bbd 0%, #a97ce0 100%);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      margin-right: 8px;
    }

    /* 質問ブロック */
    .question-block {
      margin-bottom: 18px;
    }
    .question-block:last-child {
      margin-bottom: 0;
    }
    .q-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      display: block;
    }

    /* ボタングループ */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
    }
    .btn-toggle {
      background: #faf5ff;
      border: 1.5px solid #e5d4f5;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #5b456e;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-toggle.active {
      background: linear-gradient(135deg, #f3d6ec 0%, #e5d4fb 100%);
      color: #581c87;
      border-color: #a855f7;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.2);
      font-weight: 700;
    }
    .btn-toggle:disabled {
      opacity: 0.4;
      background: #f3eff6;
      border-color: #e4dceb;
      color: #a495b0;
      cursor: not-allowed;
      text-decoration: line-through;
      box-shadow: none;
    }

    /* イラスト入りボタン調整 */
    .btn-visual {
      padding: 12px 10px;
      min-height: 92px;
    }
    .tile-illust {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
    }
    .btn-subtext {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .btn-toggle.active .btn-subtext {
      color: #6b21a8;
    }

    /* 役グリッド */
    .yaku-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 8px;
    }
    .yaku-btn {
      background: #fffafd;
      border: 1.5px solid #eadbf5;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #4c375c;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
      user-select: none;
    }
    .yaku-btn .han-tag {
      font-size: 0.72rem;
      background: #f3e8ff;
      padding: 2px 6px;
      border-radius: 6px;
      color: #7e22ce;
    }
    .yaku-btn.active {
      background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%);
      border-color: #c084fc;
      color: #581c87;
      font-weight: 700;
    }
    .yaku-btn.active .han-tag {
      background: #a855f7;
      color: #ffffff;
    }
    .yaku-btn:disabled {
      opacity: 0.35;
      background: #f5f2f7;
      border-color: #e8e1ee;
      color: #a395b0;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* ドラ・刻子ステッパー */
    .stepper {
      display: inline-flex;
      align-items: center;
      background: #faf5ff;
      border-radius: 10px;
      border: 1.5px solid #e2cff4;
      overflow: hidden;
      flex-shrink: 0;
    }
    .stepper button {
      background: transparent;
      border: none;
      padding: 8px 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      cursor: pointer;
    }
    .stepper button:hover {
      background: #f3e8ff;
    }
    .stepper span {
      min-width: 38px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }

    /* スキップ案内通知 */
    .skip-notice {
      background: linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 100%);
      border: 1.5px solid #e9d5ff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6b21a8;
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 12px;
    }

    /* 符計算用カウンター */
    .kotsu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.88rem;
    }
    .kotsu-row:last-child {
      border-bottom: none;
    }
    .kotsu-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kotsu-name {
      font-weight: 700;
      color: var(--text);
    }
    .kotsu-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .kotsu-illust {
      margin-top: 2px;
    }

    /* 固定結果バー（画面下部・淡いピンク〜薄紫） */
    .result-bar {
      position: sticky;
      bottom: 12px;
      background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%);
      color: #4c1d95;
      border: 2px solid #d8b4fe;
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .result-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .result-meta {
      font-size: 0.84rem;
      color: #7e22ce;
      font-weight: 700;
    }
    .result-yomi {
      font-size: 0.78rem;
      color: #9d174d;
      font-weight: 600;
    }
    .result-score {
      font-size: 1.65rem;
      font-weight: 800;
      color: #6b21a8;
      letter-spacing: 0.5px;
      text-align: right;
    }
    .result-breakdown {
      font-size: 0.72rem;
      color: #7c688a;
      text-align: right;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>符計算＆点数計算</h1>
    <p>質問に答えるだけで、排他ルールと符計算スキップを自動判定します</p>
  </header>

  <!-- 第1フェーズ：翻の確定 -->
  <section class="card">
    <div class="card-title">
      <span><span class="step-badge">STEP 1</span>基本条件と役（翻数）</span>
      <span id="hanSummary" style="font-size:0.9rem; color:#9333ea;">0翻</span>
    </div>

    <!-- 親・子 / ロン・ツモ -->
    <div class="question-block">
      <span class="q-label">① あなたの立場とアガリ方</span>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
        <div class="btn-group">
          <button class="btn-toggle active" id="btnChild" onclick="setRole('child')">子</button>
          <button class="btn-toggle" id="btnDealer" onclick="setRole('dealer')">親</button>
        </div>
        <div class="btn-group">
          <button class="btn-toggle active" id="btnRon" onclick="setWinType('ron')">ロン</button>
          <button class="btn-toggle" id="btnTsumo" onclick="setWinType('tsumo')">ツモ</button>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn-toggle active" id="btnMenzen" onclick="setMenzen(true)">門前（鳴いてない）</button>
        <button class="btn-toggle" id="btnNaki" onclick="setMenzen(false)">副露（ポン・チーあり）</button>
      </div>
    </div>

    <!-- リーチ -->
    <div class="question-block" id="riichiBlock">
      <span class="q-label">② リーチしましたか？</span>
      <div class="btn-group">
        <button class="btn-toggle active" id="riichiNone" onclick="setRiichi('none')">なし</button>
        <button class="btn-toggle" id="riichiNormal" onclick="setRiichi('riichi')">リーチ (1翻)</button>
        <button class="btn-toggle" id="riichiDouble" onclick="setRiichi('double')">Wリーチ (2翻)</button>
      </div>
    </div>

    <!-- 役の選択（排他制御） -->
    <div class="question-block">
      <span class="q-label">③ ついている役を選んでください</span>
      <div class="yaku-grid" id="yakuContainer"></div>
    </div>

    <!-- ドラ -->
    <div class="question-block">
      <span class="q-label">④ ドラ・赤ドラ・裏ドラの合計枚数</span>
      <div class="stepper">
        <button onclick="changeDora(-1)">−</button>
        <span id="doraCount">0</span>
        <button onclick="changeDora(1)">＋</button>
      </div>
    </div>

    <!-- スキップ案内 -->
    <div id="skipMessage" class="skip-notice" style="display:none;"></div>
  </section>

  <!-- 第2フェーズ：符の確定（必要な場合のみ表示） -->
  <section class="card" id="fuSection">
    <div class="card-title">
      <span><span class="step-badge">STEP 2</span>手牌の符計算</span>
      <span id="fuSummary" style="font-size:0.9rem; color:#be185d;">計 30符 ➔ 30符</span>
    </div>

    <div class="question-block">
      <span class="q-label">① 待ちの形は？</span>
      <div class="btn-group">
        <button class="btn-toggle btn-visual active" id="waitRyanmen" onclick="setWait('ryanmen')">
          <div class="tile-illust">
            <!-- 両面待ちのイラスト: [1(待)] ← [2][3] → [4(待)] -->
            <svg width="136" height="36" viewBox="0 0 136 36" aria-hidden="true">
              <rect x="2" y="4" width="22" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="13" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">1</text>
              <text x="33" y="22" text-anchor="middle" font-size="11" fill="#a855f7">←</text>
              <rect x="42" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="54" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">2</text>
              <rect x="70" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="82" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">3</text>
              <text x="103" y="22" text-anchor="middle" font-size="11" fill="#a855f7">→</text>
              <rect x="112" y="4" width="22" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="123" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">4</text>
            </svg>
          </div>
          <span>両面 / シャンポン</span>
          <span class="btn-subtext">+0符</span>
        </button>

        <button class="btn-toggle btn-visual" id="waitBad" onclick="setWait('bad')">
          <div class="tile-illust">
            <!-- カンチャン・単騎のイラスト: [2][3(待)][4] / [単(待)] -->
            <svg width="136" height="36" viewBox="0 0 136 36" aria-hidden="true">
              <rect x="4" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="16" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">2</text>
              <rect x="32" y="4" width="24" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="44" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">3</text>
              <rect x="60" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="72" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">4</text>
              <text x="95" y="22" text-anchor="middle" font-size="11" fill="#9ca3af">/</text>
              <rect x="105" y="4" width="24" height="28" rx="4" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 2"/>
              <text x="117" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">単</text>
            </svg>
          </div>
          <span>カンチャン / ペンチャン / 単騎</span>
          <span class="btn-subtext">+2符</span>
        </button>
      </div>
    </div>

    <div class="question-block">
      <span class="q-label">② アタマ（雀頭）の種類は？</span>
      <div class="btn-group">
        <button class="btn-toggle btn-visual active" id="headNormal" onclick="setHead('normal')">
          <div class="tile-illust">
            <!-- 数牌の対子イラスト: [五][五] -->
            <svg width="64" height="36" viewBox="0 0 64 36" aria-hidden="true">
              <rect x="6" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">五</text>
              <rect x="34" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
              <text x="46" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">五</text>
            </svg>
          </div>
          <span>数牌 / 役のない風牌</span>
          <span class="btn-subtext">+0符</span>
        </button>

        <button class="btn-toggle btn-visual" id="headYakuhai" onclick="setHead('yakuhai')">
          <div class="tile-illust">
            <!-- 役牌の対子イラスト: [中][中] -->
            <svg width="64" height="36" viewBox="0 0 64 36" aria-hidden="true">
              <rect x="6" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1.5"/>
              <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#be185d">中</text>
              <rect x="34" y="4" width="24" height="28" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1.5"/>
              <text x="46" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#be185d">中</text>
            </svg>
          </div>
          <span>役牌（白・發・中・自風・場風）</span>
          <span class="btn-subtext">+2符</span>
        </button>
      </div>
    </div>

    <div class="question-block">
      <span class="q-label">③ 刻子（3枚組）や槓子（4枚組）の個数</span>
      <div id="kotsuContainer"></div>
    </div>
  </section>
</div>

<!-- 画面下の結果バー -->
<div class="result-bar">
  <div class="result-info">
    <div class="result-meta" id="resMeta">子 / 役なし</div>
    <div class="result-yomi" id="resYomi">アガれません</div>
  </div>
  <div>
    <div class="result-score" id="resScore">0 点</div>
    <div class="result-breakdown" id="resBreakdown">役を1つ以上選択してください</div>
  </div>
</div>

<script>
// --- 状態管理 ---
const state = {
  role: 'child',       // 'child' | 'dealer'
  winType: 'ron',      // 'ron' | 'tsumo'
  menzen: true,        // true | false
  riichi: 'none',      // 'none' | 'riichi' | 'double'
  selectedYaku: [],    // 役ID配列
  dora: 0,
  waitType: 'ryanmen', // 'ryanmen' | 'bad'
  headType: 'normal',  // 'normal' | 'yakuhai'
  kotsu: {
    m2: 0,  // 中張牌の明刻 (+2)
    m4: 0,  // 中張の暗刻 / 19字の明刻 (+4)
    m8: 0,  // 19字の暗刻 / 中張の明槓 (+8)
    m16: 0, // 19字の明槓 / 中張の暗槓 (+16)
    m32: 0  // 19字の暗槓 (+32)
  }
};

// 役マスター
const YAKU_LIST = [
  { id: 'pinfu', name: '平和 (ピンフ)', han: 1, menzenOnly: true, excludes: ['yakuhai_haku', 'yakuhai_hatsu', 'yakuhai_chun', 'yakuhai_wind', 'toitoi', 'sanankou', 'chiitoitsu'] },
  { id: 'tanyao', name: 'タンヤオ', han: 1, menzenOnly: false, excludes: ['yakuhai_haku', 'yakuhai_hatsu', 'yakuhai_chun', 'yakuhai_wind', 'honitsu', 'chinitsu', 'chanta', 'junchan', 'honroto'] },
  { id: 'yakuhai_haku', name: '役牌 (白)', han: 1, menzenOnly: false, excludes: ['tanyao', 'pinfu', 'junchan', 'chinitsu'] },
  { id: 'yakuhai_hatsu', name: '役牌 (發)', han: 1, menzenOnly: false, excludes: ['tanyao', 'pinfu', 'junchan', 'chinitsu'] },
  { id: 'yakuhai_chun', name: '役牌 (中)', han: 1, menzenOnly: false, excludes: ['tanyao', 'pinfu', 'junchan', 'chinitsu'] },
  { id: 'yakuhai_wind', name: '役牌 (自風/場風)', han: 1, menzenOnly: false, excludes: ['tanyao', 'pinfu', 'junchan', 'chinitsu'] },
  { id: 'iipeikou', name: '一盃口', han: 1, menzenOnly: true, excludes: ['chiitoitsu', 'toitoi'] },
  { id: 'chiitoitsu', name: '七対子', han: 2, menzenOnly: true, excludes: ['pinfu', 'iipeikou', 'toitoi', 'sanankou'] },
  { id: 'toitoi', name: '対々和 (トイトイ)', han: 2, menzenOnly: false, excludes: ['pinfu', 'chiitoitsu', 'iipeikou'] },
  { id: 'sanankou', name: '三暗刻', han: 2, menzenOnly: false, excludes: ['pinfu', 'chiitoitsu'] },
  { id: 'sanshoku', name: '三色同順', han: 2, menzenOnly: false, hanNaki: 1, excludes: ['chiitoitsu'] },
  { id: 'ittsu', name: '一気通貫', han: 2, menzenOnly: false, hanNaki: 1, excludes: ['tanyao', 'chiitoitsu'] },
  { id: 'chanta', name: 'チャンタ', han: 2, menzenOnly: false, hanNaki: 1, excludes: ['tanyao', 'junchan', 'chinitsu'] },
  { id: 'junchan', name: '純チャン', han: 3, menzenOnly: false, hanNaki: 2, excludes: ['tanyao', 'chanta', 'yakuhai_haku', 'yakuhai_hatsu', 'yakuhai_chun', 'yakuhai_wind', 'honitsu'] },
  { id: 'honitsu', name: '混一色', han: 3, menzenOnly: false, hanNaki: 2, excludes: ['tanyao', 'chinitsu', 'junchan'] },
  { id: 'chinitsu', name: '清一色', han: 6, menzenOnly: false, hanNaki: 5, excludes: ['tanyao', 'honitsu', 'chanta', 'yakuhai_haku', 'yakuhai_hatsu', 'yakuhai_chun', 'yakuhai_wind'] }
];

// 刻子・槓子のリスト（ミニ牌イラスト付き）
const KOTSU_TYPES = [
  {
    key: 'm2',
    name: '中張牌の明刻 (ポン)',
    sub: '2〜8の数牌 (+2符)',
    svg: `<svg width="78" height="26" viewBox="0 0 78 26" aria-hidden="true">
      <rect x="2" y="7" width="24" height="17" rx="3" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.3"/>
      <text x="14" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#be185d">5</text>

// --- 初期化 ---
function init() {
  renderYakuGrid();
  renderKotsuRows();
  recalc();
}

// 役グリッドの描画
function renderYakuGrid() {
  const container = document.getElementById('yakuContainer');
  container.innerHTML = '';

  YAKU_LIST.forEach(yaku => {
    const btn = document.createElement('button');
    btn.className = 'yaku-btn';
    btn.id = 'yaku_' + yaku.id;

    const actualHan = (!state.menzen && yaku.hanNaki !== undefined) ? yaku.hanNaki : yaku.han;
    btn.innerHTML = `<span>${yaku.name}</span><span class="han-tag">${actualHan}翻</span>`;

    btn.onclick = () => toggleYaku(yaku.id);
    container.appendChild(btn);
  });
}

// 刻子カウンターの描画
function renderKotsuRows() {
  const container = document.getElementById('kotsuContainer');
  container.innerHTML = '';

  KOTSU_TYPES.forEach(item => {
    const row = document.createElement('div');
    row.className = 'kotsu-row';
    row.innerHTML = `
      <div class="kotsu-left">
        <span class="kotsu-name">${item.name}</span>
        <span class="kotsu-sub">${item.sub}</span>
        <div class="kotsu-illust">${item.svg}</div>
      </div>
      <div class="stepper">
        <button onclick="changeKotsu('${item.key}', -1)">−</button>
        <span id="kotsu_${item.key}">0</span>
        <button onclick="changeKotsu('${item.key}', 1)">＋</button>
      </div>
    `;
    container.appendChild(row);
  });
}

// --- 操作ハンドラ ---
function setRole(role) {
  state.role = role;
  document.getElementById('btnChild').classList.toggle('active', role === 'child');
  document.getElementById('btnDealer').classList.toggle('active', role === 'dealer');
  recalc();
}

function setWinType(winType) {
  state.winType = winType;
  document.getElementById('btnRon').classList.toggle('active', winType === 'ron');
  document.getElementById('btnTsumo').classList.toggle('active', winType === 'tsumo');
  recalc();
}

function setMenzen(menzen) {
  state.menzen = menzen;
  document.getElementById('btnMenzen').classList.toggle('active', menzen);
  document.getElementById('btnNaki').classList.toggle('active', !menzen);

  // 鳴きならリーチ不可
  const riichiBlock = document.getElementById('riichiBlock');
  if (!menzen) {
    setRiichi('none');
    riichiBlock.style.opacity = '0.4';
    riichiBlock.style.pointerEvents = 'none';
  } else {
    riichiBlock.style.opacity = '1';
    riichiBlock.style.pointerEvents = 'auto';
  }

  // 門前役の自動解除
  state.selectedYaku = state.selectedYaku.filter(id => {
    const yaku = YAKU_LIST.find(y => y.id === id);
    return !(yaku && yaku.menzenOnly && !menzen);
  });

  renderYakuGrid();
  recalc();
}

function setRiichi(riichi) {
  state.riichi = riichi;
  ['riichiNone', 'riichiNormal', 'riichiDouble'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  if (riichi === 'none') document.getElementById('riichiNone').classList.add('active');
  if (riichi === 'riichi') document.getElementById('riichiNormal').classList.add('active');
  if (riichi === 'double') document.getElementById('riichiDouble').classList.add('active');
  recalc();
}

function toggleYaku(yakuId) {
  const index = state.selectedYaku.indexOf(yakuId);
  if (index >= 0) {
    state.selectedYaku.splice(index, 1);
  } else {
    // 排他関係にある役を自動解除
    const target = YAKU_LIST.find(y => y.id === yakuId);
    if (target && target.excludes) {
      state.selectedYaku = state.selectedYaku.filter(id => !target.excludes.includes(id));
    }
    // 逆方向の排他も解除
    state.selectedYaku = state.selectedYaku.filter(id => {
      const y = YAKU_LIST.find(item => item.id === id);
      return !(y && y.excludes && y.excludes.includes(yakuId));
    });

    state.selectedYaku.push(yakuId);
  }
  recalc();
}

function changeDora(delta) {
  state.dora = Math.max(0, Math.min(13, state.dora + delta));
  document.getElementById('doraCount').innerText = state.dora;
  recalc();
}

function setWait(wait) {
  state.waitType = wait;
  document.getElementById('waitRyanmen').classList.toggle('active', wait === 'ryanmen');
  document.getElementById('waitBad').classList.toggle('active', wait === 'bad');
  recalc();
}

function setHead(head) {
  state.headType = head;
  document.getElementById('headNormal').classList.toggle('active', head === 'normal');
  document.getElementById('headYakuhai').classList.toggle('active', head === 'yakuhai');
  recalc();
}

function changeKotsu(key, delta) {
  state.kotsu[key] = Math.max(0, Math.min(4, state.kotsu[key] + delta));
  document.getElementById('kotsu_' + key).innerText = state.kotsu[key];
  recalc();
}

// --- 排他ルールの判定とボタン更新 ---
function updateYakuButtons() {
  YAKU_LIST.forEach(yaku => {
    const btn = document.getElementById('yaku_' + yaku.id);
    if (!btn) return;

    const isSelected = state.selectedYaku.includes(yaku.id);
    btn.classList.toggle('active', isSelected);

    let disabled = false;

    // 門前限定役
    if (yaku.menzenOnly && !state.menzen) disabled = true;

    // 他の選択役との排他チェック
    state.selectedYaku.forEach(selectedId => {
      if (selectedId === yaku.id) return;
      const sYaku = YAKU_LIST.find(y => y.id === selectedId);
      if (sYaku && sYaku.excludes && sYaku.excludes.includes(yaku.id)) disabled = true;
      if (yaku.excludes && yaku.excludes.includes(selectedId)) disabled = true;
    });

    btn.disabled = disabled;
  });

  // タンヤオ選択時の符計算（役牌頭）の無効化
  const hasTanyao = state.selectedYaku.includes('tanyao');
  const headYakuhaiBtn = document.getElementById('headYakuhai');
  if (hasTanyao) {
    if (state.headType === 'yakuhai') setHead('normal');
    headYakuhaiBtn.disabled = true;
    headYakuhaiBtn.title = 'タンヤオ成立時は役牌雀頭不可';
  } else {
    headYakuhaiBtn.disabled = false;
    headYakuhaiBtn.title = '';
  }
}

// --- 符・翻・点数の総合計算 ---
function recalc() {
  updateYakuButtons();

  // 1. 翻数の集計
  let han = 0;
  if (state.riichi === 'riichi') han += 1;
  if (state.riichi === 'double') han += 2;

  state.selectedYaku.forEach(id => {
    const y = YAKU_LIST.find(item => item.id === id);
    if (y) {
      const h = (!state.menzen && y.hanNaki !== undefined) ? y.hanNaki : y.han;
      han += h;
    }
  });

  han += state.dora;
  document.getElementById('hanSummary').innerText = han + '翻';

  // 2. 符計算スキップ条件の判定
  const fuSection = document.getElementById('fuSection');
  const skipMessage = document.getElementById('skipMessage');
  let finalFu = 30;
  let skipReason = '';

  const hasPinfu = state.selectedYaku.includes('pinfu');
  const hasChiitoi = state.selectedYaku.includes('chiitoitsu');

  if (han >= 5) {
    skipReason = `🎉 <strong>${han}翻で満貫以上確定！</strong> 符に関係なく点数が決まるため、符計算は不要です。`;
  } else if (hasChiitoi) {
    finalFu = 25;
    skipReason = '七対子（チートイツ）は <strong>25符固定</strong> です。符計算は不要です。';
  } else if (hasPinfu && state.winType === 'tsumo') {
    finalFu = 20;
    skipReason = '門前平和ツモは特例により <strong>20符固定</strong> です。符計算は不要です。';
  } else if (hasPinfu && state.winType === 'ron') {
    finalFu = 30;
    skipReason = '門前平和ロンは <strong>30符固定</strong> です。符計算は不要です。';
  }

  if (skipReason) {
    fuSection.style.display = 'none';
    skipMessage.innerHTML = skipReason;
    skipMessage.style.display = 'flex';
  } else {
    fuSection.style.display = 'block';
    skipMessage.style.display = 'none';

    // 通常の符計算
    let rawFu = 20; // 底符
    if (state.menzen && state.winType === 'ron') rawFu += 10; // 門前加符
    if (state.winType === 'tsumo') rawFu += 2; // ツモ符
    if (state.waitType === 'bad') rawFu += 2;  // 愚形待ち
    if (state.headType === 'yakuhai') rawFu += 2; // 役牌頭

    rawFu += state.kotsu.m2 * 2;
    rawFu += state.kotsu.m4 * 4;
    rawFu += state.kotsu.m8 * 8;
    rawFu += state.kotsu.m16 * 16;
    rawFu += state.kotsu.m32 * 32;

    // 切り上げ（鳴きロンで20符の形は30符特例）
    if (!state.menzen && state.winType === 'ron' && rawFu === 20) {
      finalFu = 30;
    } else {
      finalFu = Math.ceil(rawFu / 10) * 10;
    }
    if (finalFu < 30 && !hasChiitoi) finalFu = 30;

    document.getElementById('fuSummary').innerText = `計 ${rawFu}符 ➔ ${finalFu}符`;
  }

  // 3. 点数算出と表示更新
  updateResult(han, finalFu);
}

      scoreStr = isDealer ? '48,000 点' : '32,000 点';
      yomi = isDealer ? (state.winType === 'ron' ? 'ヨンパチ' : 'イチロクオール') : (state.winType === 'ron' ? 'ザンニ' : 'ハッセン・イチロク');
      breakStr = isDealer ? (state.winType === 'tsumo' ? '16,000点オール' : '') : (state.winType === 'tsumo' ? '子8,000 / 親16,000' : '');
    }

    metaEl.innerText = `${roleName} / ${han}翻 【${title}】`;
    yomiEl.innerText = yomi;
    scoreEl.innerText = scoreStr;
    breakEl.innerText = breakStr;
    return;
  }

  // 1〜4翻の通常計算
  const safeFu = fu > 70 ? 70 : fu;
  const table = isDealer ? SCORE_DATA.dealer : SCORE_DATA.child;
  const entry = (table[safeFu] && table[safeFu][han]) ? table[safeFu][han] : null;

  metaEl.innerText = `${roleName} / ${han}翻 ${safeFu}符`;

  if (!entry) {
    scoreEl.innerText = isDealer ? '満貫 12,000 点' : '満貫 8,000 点';
    yomiEl.innerText = 'マンガン';
    breakEl.innerText = '';
    return;
  }

  if (state.winType === 'tsumo') {
    if (entry.tsumo) {
      scoreEl.innerText = entry.tsumo;
      yomiEl.innerText = entry.yomi || '';
      breakEl.innerText = isDealer ? '各家から均等払い' : '子払い / 親払い';
    } else {
      scoreEl.innerText = entry.ron ? entry.ron.toLocaleString() + ' 点' : '-';
      yomiEl.innerText = entry.yomi || '';
      breakEl.innerText = '';
    }
  } else {
    if (entry.ron) {
      scoreEl.innerText = entry.ron.toLocaleString() + ' 点';
      yomiEl.innerText = entry.yomi || '';
      breakEl.innerText = '放銃者の全額払い';
    } else {
      scoreEl.innerText = entry.tsumo || '-';
      yomiEl.innerText = entry.yomi || '';
      breakEl.innerText = '';
    }
  }
}

// 起動
init();
</script>

</html>
